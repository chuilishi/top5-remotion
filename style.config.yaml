# ============================================================
#  🎨 视觉风格配置 — 一般不用变动
#
#  控制整个视频模板的视觉风格:
#    字体、配色、字号、动画参数、特效强度 等
#
#  换主题 (比如做银色版/红色版) 或换分辨率时才需要调整
# ============================================================


# ── 字体族 ───────────────────────────────────────────────
#
# 渲染环境可用字体:
#   Noto Sans CJK SC Black  — 最粗中文黑体, 系统已装
#   Poppins Bold            — 英文几何无衬线, 系统已装
#
# ⚠️ Arial Black / Impact 不可用, 会回退成很细的 DejaVu Sans
#
fonts:
  # 大标题 / 排名数字 — 最粗
  title:     "'Noto Sans CJK SC', 'Noto Sans CJK TC', 'Poppins', 'Helvetica Neue', sans-serif"
  # 字幕 — 粗, 可换字体区分层次
  subtitle:  "'Noto Sans CJK SC', 'Noto Sans CJK TC', 'Poppins', 'Helvetica Neue', sans-serif"
  # 统计数字 — 等宽感更好
  stat:      "'Poppins', 'Noto Sans CJK SC', 'Helvetica Neue', sans-serif"
  # 水印
  watermark: "'Poppins', 'Noto Sans CJK SC', 'Helvetica Neue', sans-serif"


# ── 配色方案 ─────────────────────────────────────────────
colors:
  # 视频全局背景 (各场景间隙可见)
  globalBg: "#000"

  # 无视频时的占位渐变背景 (GameTitleCard / FallbackBg 共用)
  fallbackBg: "linear-gradient(135deg, #0a0a1a, #1a1a2e, #0f3460)"

  # 金色渐变 — 标题字、排名数字、统计数字都用这套
  # 明亮鲜艳的黄金色, 匹配原视频的醒目风格
  goldGradient:
    - { offset: "0%",   color: "#ffe640" }
    - { offset: "40%",  color: "#ffd700" }
    - { offset: "100%", color: "#ffe000" }

  # 标题卡 / 开场字符出现时的发光色 (feFlood)
  glowColor: "#FFD700"

  # 统计数字背后的椭圆发光色 (红色系)
  statGlowColor: "rgb(255, 40, 20)"

  # SVG 文字描边色 (纯黑, 与明亮填充形成最强对比)
  goldStroke: "#000000"


# ── 字幕条 ───────────────────────────────────────────────
#
# 当前数值基于 1920×1080 分辨率
#
subtitle:
  fontSize: 86
  bottom: 68                    # 距底部 (px)
  color: "#FFFFFF"
  strokeWidth: 16               # -webkit-text-stroke 宽度 (px), 粗描边匹配参考风格
  strokeColor: "#000"
  textShadow: "0 5px 14px rgba(0,0,0,1), 0 0 32px rgba(0,0,0,0.7), 5px 5px 18px rgba(0,0,0,0.8)"
  padding: "0"
  bgColor: "transparent"       # 无背景条, 纯文字浮在视频上


# ── 统计大数字 ───────────────────────────────────────────
statNumber:
  fontSize: 162
  spreadRatio: 0.29             # 扩散幅度 = width × 0.29
  strokeWidth: 22               # SVG 文字描边粗细 (加粗匹配原视频)

  # 各类字符的宽度 = fontSize × ratio (用于精确排版)
  charWidthRatios:
    digit: 0.58
    comma: 0.32
    plusMinus: 0.50
    dot: 0.28

  # 各类字符的展开权重 (数字正常, 标点扩散少)
  charSpreadWeights:
    digit: 1.0
    comma: 0.35
    plusMinus: 0.55
    dot: 0.3


# ── 水印 ─────────────────────────────────────────────────
watermark:
  fontSize: 54
  top: 22                       # 距顶部 (px)
  fillColor: "#FFD700"          # 金色填充
  strokeColor: "#000"           # 黑色描边
  strokeWidth: 11


# ── 排名数字过渡 ────────────────────────────────────────
rankNumber:
  svgSize: 630                  # SVG 容器尺寸
  fontSize: 540                 # 数字字号 (很大, 占满容器)
  lineSpacing: 63               # 线纹理间距
  lineStrokeWidth: 7            # 描边粗细（略粗，拖尾时更清晰）
  goldStrokeWidth: 7            # 金属渐变期间的描边粗细


# ── Ken Burns 摄像机运动 ────────────────────────────────
#
# 用于 gameplay 段的视频片段
# zoomRange: 从 1.0 缓慢放大到 1.08 (8%)
# panXRange: 水平平移 0 → -15px (向左微移)
#
kenBurns:
  zoomRange: [1.0, 1.08]
  panXRange: [0, -34]


# ── 电影叠加 (胶片颗粒 + 暗角) ─────────────────────────
#
# grain:    颗粒强度 (0.02~0.05 微妙, >0.1 明显可见)
# vignette: 暗角强度 (0.1~0.3 自然范围)
#
cinematic:
  intro:          { grain: 0.035, vignette: 0.20 }
  rankTransition: { grain: 0.035, vignette: 0.25 }
  titleCard:      { grain: 0.030, vignette: 0.20 }
  gameplay:       { grain: 0.025, vignette: 0.15 }
  ending:         { grain: 0.040, vignette: 0.30 }


# ── 撕裂纸张效果 ────────────────────────────────────────
tornPaper:
  tearHeightRatio: 0.16         # 撕裂高度 = 画面高度 × 0.16
  edgeSteps: 120                # 撕裂线采样点数 (越多越细腻, 性能开销越大)
  edgeAmplitude: 22             # 撕裂线锯齿幅度 (px)

  # 裂缝内红色渐变 (从左到右)
  crackGradientColors:
    - "#5a0000"
    - "#200808"
    - "#3a0505"
    - "#1a0404"
    - "#2a0808"
    - "#5a0000"

  # 纸张撕裂边缘色 (从亮面到暗面)
  edgeTopColors:    ["#7a756a", "#a8a090", "#bab2a2", "#8a8575"]
  edgeBottomColors: ["#7a756a", "#a8a090", "#bab2a2", "#8a8575"]

  # 纸张投影
  shadowBlur: 16                # 投影模糊半径
  shadowOffset: 9               # 投影偏移
  shadowOpacity: 0.85           # 投影不透明度

  # 边缘线
  edgeLineColor: "rgba(160,150,138,0.35)"
  edgeLineWidth: 0.7


# ── 开场标题动画参数 ────────────────────────────────────
intro:
  fontSizeRatio: 0.175          # 字号 = width × ratio
  fontSizeMax: 338              # 字号上限 (px)
  lineGapRatio: 0.005           # 两行间距 = height × ratio（极小）
  spreadRatio: 0.06             # 汇聚展开幅度 = width × ratio
  shuffleSeed: 42               # 随机打散种子 (决定字符出现顺序)
  delayBase: 2                  # 首个字符延迟 (帧)
  delayInterval: 1.5            # 每个后续字符的间隔 (帧)
  strokeWidth: 14               # SVG 文字描边粗细（金色扩展，适度加粗）
  shadowOffsetX: 7              # 投影水平偏移 (px)
  shadowOffsetY: 9              # 投影垂直偏移 (px)


# ── 游戏标题卡动画参数 ──────────────────────────────────
titleCard:
  # 自适应字号: [字符数上限, width乘数, 像素上限]
  # 依次匹配, 超出最后一档用最后一行
  fontSizeBreakpoints:
    - [4,       0.200, 326]     # ≤4个字符: 超大
    - [8,       0.145, 248]     # ≤8个字符: 大
    - [12,      0.110, 202]     # ≤12个字符: 中
    - [999999,  0.085, 153]     # >12个字符: 较小  (YAML 不支持 Infinity, 用大数代替)

  delayBase: 5                  # 首个字符延迟 (帧)
  delayInterval: -1             # -1 = 自动: max(0.8, 12/字符数)
  charPadding: 0.14             # measureText 后的额外间距 (fontSize 的倍数)
  strokeWidth: 34               # SVG 文字描边粗细 (居中, 外侧可见约一半)
  shadowOffsetX: 7              # 投影水平偏移 (px)
  shadowOffsetY: 9              # 投影垂直偏移 (px)
