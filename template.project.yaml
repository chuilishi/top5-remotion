# ╔══════════════════════════════════════════════════════════╗
# ║  project.yaml 模板                                      ║
# ║  全局元数据（标题、fps、timing）                          ║
# ║  rank YAML 文件是主要数据源                               ║
# ║  修改后运行: npm run project -- <project-name>           ║
# ╚══════════════════════════════════════════════════════════╝

titleLine1: ""           # 标题第一行（如 "全球搜索引擎"）
titleLine2: ""           # 标题第二行（如 "TOP 5"）
watermark: ""
fps: 30
width: 1920
height: 1080
timing:
  introDuration: 2
  rankTransitionDurations: [2, 2, 2, 2, 3]    # #1 额外悬念加长
  # gameplayDurations = 每段最小时长（旁白结束 + 0.5s 缓冲）
  # 再将 #5→#2 的剩余 buffer 均匀分配，使 #1 transition 对齐 72s 卡点
  # 尾部缓冲理想区间: 0.3–1.5s
  gameplayDurations: [20, 20, 20, 20, 20]      # REPLACE: 从各 rank YAML 自动计算

# games 数组顺序: #5 → #4 → #3 → #2 → #1
# 每个条目从对应的 rank YAML 文件复制（见 template.rank.yaml）
games:
  # ── rank_5_xxx.yaml 内容粘贴到这里 ──
  - rank: 5
    titleEn: ""
    titleZh: ""
    voiceover: []        # 从 rank YAML 复制
    subtitles: []        # 从 rank YAML 复制
    stats: []            # 从 rank YAML 复制
    clips: []            # 从 rank YAML 复制

  # ── rank_4_xxx.yaml ──
  - rank: 4
    titleEn: ""
    titleZh: ""
    voiceover: []
    subtitles: []
    stats: []
    clips: []

  # ── rank_3_xxx.yaml ──
  - rank: 3
    titleEn: ""
    titleZh: ""
    voiceover: []
    subtitles: []
    stats: []
    clips: []

  # ── rank_2_xxx.yaml ──
  - rank: 2
    titleEn: ""
    titleZh: ""
    voiceover: []
    subtitles: []
    stats: []
    clips: []

  # ── rank_1_xxx.yaml ──
  - rank: 1
    titleEn: ""
    titleZh: ""
    voiceover: []
    subtitles: []
    stats: []
    clips: []
