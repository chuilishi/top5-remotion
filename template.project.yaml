# ╔══════════════════════════════════════════════════════════╗
# ║  project.yaml 模板（Top5Video）                          ║
# ║  只放全局元数据；排名数据全部在 rank_*.yaml               ║
# ║  修改后运行: npm run project -- <project-name>           ║
# ╚══════════════════════════════════════════════════════════╝

template: Top5Video
titleLine1: ""           # 标题第一行（如 "全球搜索引擎"）
titleLine2: ""           # 标题第二行（如 "TOP 5"）
watermark: ""
fps: 60
width: 1920
height: 1080
timing:
  introDuration: 2
  rankTransitionDurations: [2, 2, 2, 2, 3]    # #1 额外悬念加长
  # gameplayDurations 不要写：npm run config 根据 rank YAML 的配音时长自动计算，
  # 把 #5→#2 的剩余 buffer 均分，使 #1 画面对齐 72s 卡点，
  # 结果写入 public/_active/project.json 并打印在终端
